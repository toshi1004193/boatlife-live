# BOAT LIFE の展示データ(5分おき)
# 公開リポジトリ(boatlife-live)で動きます。公開リポジトリなので GitHub Actions の利用時間は無料です。
# 元のファイルは非公開リポジトリ(boatlife-src)の live/live.yml。publish.py がここへコピーしています。
# サイトのページは、ここの live/before_日付.json を1分おきに読みに来ます。
# 日本時間 8:00〜23:59 に5分おき(混みやすい「ちょうど」を避けて、3分・8分・13分…に動かす)
# ※ 定期実行は「最後にこのファイルの cron を変えた人」の名義で動きます。ボット名義だと動かないため、
#   このファイルを変えたら、公開リポジトリにも本人のアカウントで同じ内容を入れてください。
name: live

on:
  schedule:
    - cron: "3-58/5 23 * * *"     # 日本時間 8時台
    - cron: "3-58/5 0-14 * * *"   # 日本時間 9時〜23時台
  workflow_dispatch: {}

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: write                # live/before_日付.json を保存するため

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: 締切が近いレースの展示データを取る
        run: python3 tools/live_before.py

      - name: 保存する
        run: |
          git config user.name "boatlife-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -q -m "展示データを更新 $(date '+%H:%M')"
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then break; fi
            sleep 5
          done
